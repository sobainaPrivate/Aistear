# Events (formerly the "Ihsan" stream — character and spiritual development).
#
# upcoming: each entry needs a matching page at events/<slug>.md (front matter: slug + title)
#           which renders with _layouts/event.html. Includes events currently running.
# past:     shown as highlight cards on /events/. No detail page needed.
# When an event finishes, move it from upcoming to past and delete its events/<slug>.md.
#
# Fields: slug, title, tagline, date, time, ages, fee, partner, image, summary, description.
# image is optional — cards show a placeholder when it's missing.

